name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10, 3.11]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          # dev tools used by the workflow
          pip install pytest black flake8

      - name: Run tests
        run: |
          pytest -q

      - name: Run black (format check)
        run: |
          black --check .

      - name: Run flake8 (lint)
        run: |
          flake8 .

      - name: Run notebook demo (nbval)
        run: |
          python -m pip install --upgrade pip
          pip install nbval nbformat
          # Run pytest with nbval plugin to execute the demo notebook
          pytest -q --nbval-lax examples/notebooks/detection_classification_demo.ipynb

      - name: Run notebook demo (nbconvert fallback & artifact)
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert
          mkdir -p artifacts
          jupyter nbconvert --to html --execute examples/notebooks/detection_classification_demo.ipynb --output artifacts/detection_classification_demo.html --ExecutePreprocessor.timeout=600

      - name: Run gallery notebook (nbconvert & artifact)
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert
          mkdir -p artifacts/gallery
          # Execute and convert gallery notebook; images will be emitted into the dataset's gallery dir
          jupyter nbconvert --to html --execute examples/notebooks/maneuver_gallery.ipynb --output artifacts/maneuver_gallery.html --ExecutePreprocessor.timeout=600
          ls -lah examples/datasets/maneuvers_small/gallery || true

      - name: Upload notebook artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notebook-artifacts
          path: |
            artifacts/detection_classification_demo.html
            artifacts/maneuver_gallery.html
            examples/datasets/maneuvers_small/gallery/**
